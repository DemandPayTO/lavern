# DemandPay Starling — Fly.io deployment config
# Deploy: fly deploy   (primary_region below pins yyz)
# Region: Toronto (yyz) — data stays in Canada

app = "demandpay-starling"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  SHEM_PORT = "3000"
  SHEM_HOST = "0.0.0.0"
  SHEM_MODEL = "claude-sonnet-5"
  SHEM_ROUTER_MODEL = "claude-sonnet-5"
  SHEM_DEFAULT_BUDGET = "3.00"
  SHEM_MAX_TURNS = "15"
  SHEM_GENERIC_MAX_TURNS = "12"
  SHEM_DB_PATH = "/data/starling.db"
  SHEM_AUDIT_DIR = "/data/audit-logs"
  SHEM_MEMORY_DIR = "/data/memory"
  SHEM_REPORTS_DIR = "/data/reports"
  SHEM_BASELINES_DIR = "/data/baselines"
  SHEM_CORS_ORIGINS = "https://starling.demandpay.ca,https://demandpay-starling.fly.dev"
  LAVERN_AUTH_ENABLED = "true"
  LAVERN_WAITLIST_ENABLED = "false"
  # Public self-signup CLOSED for the pilot: accounts are provisioned
  # manually (scripts/provision-firm-user.ts over fly ssh) so that firm
  # membership is deliberate. Covers both the password flow and Google
  # OAuth. Set to "false" only if open registration is wanted again.
  LAVERN_SIGNUP_DISABLED = "true"
  LAVERN_BILLING_CURRENCY = "cad"
  # Weekly digest DISABLED for the pilot (emails a firm-wide docket with
  # client matter labels; more risk than value at this stage). To re-enable:
  # set STARLING_DIGEST_ENABLED = "true" and STARLING_DIGEST_EMAIL below.
  # STARLING_DIGEST_EMAIL = "demandpayto@gmail.com"
  # 300/min per IP: the dashboard fans out ~30 requests per load (matter
  # list + per-matter employment enrichment); the default 100/min let an
  # active firm user rate-limit themselves (verified via local probe).
  # Auth (5/min login) and session-creation (10/min) limits are separate
  # and unchanged.
  SHEM_RATE_LIMIT_MAX = "300"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 30

# Persistent volume for SQLite + institutional memory
[mounts]
  source = "starling_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB, not the 512 MB default: parsing an uploaded document (PDF or DOCX
  # up to 10 MB, expanded to text and HTML) pushed the process past 512 MB
  # and the kernel OOM-killed it mid-request, restarting the server and
  # returning 502 to everyone connected (2026-08-04). Keep this in step with
  # NODE_OPTIONS=--max-old-space-size in the Dockerfile: fly.toml wins on
  # every deploy, so a scale made only on the CLI is silently reverted here.
  memory = "1024mb"
